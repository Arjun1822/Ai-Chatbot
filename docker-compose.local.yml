# Local Development Docker Compose with Containerized MongoDB
# Usage: docker-compose -f docker-compose.local.yml up --build

services:
  mongodb:
    image: mongo:7.0
    container_name: orbit-mongodb-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: orbit_ai
    volumes:
      - mongo_data_local:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbit-backend-local
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - MONGODB_URI=mongodb://mongodb:27017/orbit_ai
      - DATABASE_NAME=orbit_ai
      - FRONTEND_URL=http://localhost:3000
      - SECRET_KEY=${SECRET_KEY:-local-development-secret-key-32chars}
      - RATE_LIMIT_REQUESTS=120
      - RATE_LIMIT_WINDOW_SECONDS=60
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_data_local:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbit-frontend-local
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data_local:
  backend_data_local:
